<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0057E0"/>
      <stop offset="60%" stop-color="#0073FF"/>
      <stop offset="100%" stop-color="#00C4FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#002B7A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Decorative geometric accents (Webnode style) -->
  <circle cx="530" cy="70" r="120" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="80" cy="340" r="90" fill="#00C4FF" opacity="0.15"/>
  <circle cx="500" cy="320" r="16" fill="#00D9C0" opacity="0.5"/>
  <circle cx="120" cy="80" r="8" fill="#FFFFFF" opacity="0.4"/>

  <!-- Main Tech Window -->
  <g filter="url(#shadow)">
    <rect x="80" y="60" width="440" height="280" rx="16" fill="#0A1628" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect x="80" y="60" width="440" height="40" rx="16" fill="#132238"/>
    <rect x="80" y="85" width="440" height="15" fill="#132238"/>
    <circle cx="106" cy="80" r="5" fill="#FF5F56"/>
    <circle cx="122" cy="80" r="5" fill="#FFBD2E"/>
    <circle cx="138" cy="80" r="5" fill="#27C93F"/>
    
    <!-- Address Bar -->
    <rect x="160" y="70" width="280" height="20" rx="6" fill="#0A1628" opacity="0.6"/>
    <rect x="175" y="77" width="100" height="6" rx="3" fill="#8BA3C7" opacity="0.7"/>

    <!-- Code & Architecture Editor Content -->
    <rect x="110" y="125" width="90" height="10" rx="5" fill="#00C4FF"/>
    <rect x="110" y="148" width="160" height="8" rx="4" fill="#8BA3C7" opacity="0.8"/>
    <rect x="130" y="166" width="120" height="7" rx="3.5" fill="#00D9C0" opacity="0.9"/>
    <rect x="130" y="182" width="180" height="7" rx="3.5" fill="#CBD5E8" opacity="0.7"/>
    <rect x="150" y="198" width="140" height="7" rx="3.5" fill="#00C4FF" opacity="0.85"/>
    <rect x="110" y="222" width="70" height="8" rx="4" fill="#8BA3C7" opacity="0.8"/>
    <rect x="110" y="246" width="130" height="8" rx="4" fill="#00D9C0"/>

    <!-- Right Side Tech Components Card -->
    <rect x="330" y="120" width="160" height="185" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    
    <!-- Mini Metric Cards -->
    <rect x="345" y="135" width="130" height="42" rx="8" fill="#132238"/>
    <circle cx="365" cy="156" r="10" fill="#0066FF"/>
    <path d="M361 156l3 3 6-6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="385" y="148" width="70" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="385" y="159" width="45" height="5" rx="2.5" fill="#8BA3C7"/>

    <rect x="345" y="187" width="130" height="42" rx="8" fill="#132238"/>
    <circle cx="365" cy="208" r="10" fill="#00D9C0"/>
    <rect x="360" y="204" width="10" height="8" rx="2" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    <rect x="385" y="200" width="60" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="385" y="211" width="75" height="5" rx="2.5" fill="#8BA3C7"/>

    <rect x="345" y="239" width="130" height="48" rx="8" fill="#0066FF" opacity="0.9"/>
    <text x="365" y="268" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">✓ Sistema Ativo</text>
  </g>

  <!-- Floating Webnode Badge -->
  <g transform="translate(430, 40)" filter="url(#shadow)">
    <rect width="120" height="34" rx="17" fill="#00C4FF"/>
    <text x="60" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0A1628" text-anchor="middle">TECNOLOGIA</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#003580"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg2)"/>

  <!-- AI Neural Network Grid (Webnode Tech style) -->
  <g opacity="0.4" stroke="#00C4FF" stroke-width="1.2">
    <line x1="120" y1="100" x2="220" y2="160"/>
    <line x1="220" y1="160" x2="300" y2="110"/>
    <line x1="220" y1="160" x2="320" y2="230"/>
    <line x1="300" y1="110" x2="420" y2="140"/>
    <line x1="320" y1="230" x2="440" y2="220"/>
    <line x1="420" y1="140" x2="480" y2="200"/>
    <line x1="440" y1="220" x2="480" y2="200"/>
    <line x1="150" y1="260" x2="220" y2="160"/>
    <line x1="150" y1="260" x2="320" y2="230"/>
  </g>

  <!-- Node points -->
  <circle cx="120" cy="100" r="8" fill="#00C4FF" filter="url(#glow)"/>
  <circle cx="220" cy="160" r="12" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="300" cy="110" r="9" fill="#00D9C0" filter="url(#glow)"/>
  <circle cx="320" cy="230" r="14" fill="#0066FF" stroke="#00C4FF" stroke-width="3" filter="url(#glow)"/>
  <circle cx="420" cy="140" r="10" fill="#00C4FF" filter="url(#glow)"/>
  <circle cx="440" cy="220" r="8" fill="#00D9C0" filter="url(#glow)"/>
  <circle cx="480" cy="200" r="11" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="150" cy="260" r="7" fill="#8BA3C7"/>

  <!-- Main Central Insight Card -->
  <rect x="180" y="270" width="240" height="75" rx="14" fill="rgba(10, 22, 40, 0.85)" stroke="rgba(0, 196, 255, 0.5)" stroke-width="1.5"/>
  <circle cx="215" cy="307" r="16" fill="#0066FF"/>
  <path d="M210 307h10M215 302v10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="245" y="302" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Pesquisa Acadêmica &amp; IA</text>
  <text x="245" y="320" font-family="system-ui, sans-serif" font-size="11" fill="#8BA3C7">Análise de Dados &amp; Modelos</text>

  <!-- Top Badge -->
  <g transform="translate(420, 36)">
    <rect width="130" height="34" rx="17" fill="#00D9C0"/>
    <text x="65" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0A1628" text-anchor="middle">CIÊNCIA &amp; IA</text>
  </g>
</svg>

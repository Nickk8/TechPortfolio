<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0057E0"/>
      <stop offset="40%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00D9C0"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#002466" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg4)"/>

  <!-- Geometric Grid & Circles (Webnode Innovation) -->
  <circle cx="100" cy="90" r="70" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="500" cy="310" r="130" fill="#00C4FF" opacity="0.12"/>

  <!-- Analytics / Project Growth Card -->
  <g filter="url(#shadow4)">
    <rect x="90" y="70" width="420" height="260" rx="18" fill="#FFFFFF"/>
    
    <!-- Top Bar -->
    <rect x="120" y="98" width="160" height="12" rx="6" fill="#0D1B3E"/>
    <rect x="120" y="118" width="100" height="6" rx="3" fill="#8D9BB5"/>
    
    <rect x="400" y="94" width="80" height="26" rx="13" fill="#E8F9F0"/>
    <text x="440" y="111" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">+94% Impacto</text>

    <!-- Chart Visual -->
    <g transform="translate(120, 150)">
      <!-- Grid lines -->
      <line x1="0" y1="30" x2="360" y2="30" stroke="#F0F4FF" stroke-width="1.5"/>
      <line x1="0" y1="70" x2="360" y2="70" stroke="#F0F4FF" stroke-width="1.5"/>
      <line x1="0" y1="110" x2="360" y2="110" stroke="#F0F4FF" stroke-width="1.5"/>

      <!-- Rising bar graphs -->
      <rect x="30" y="60" width="28" height="60" rx="6" fill="#D8E2F0"/>
      <rect x="90" y="45" width="28" height="75" rx="6" fill="#8BA3C7"/>
      <rect x="150" y="30" width="28" height="90" rx="6" fill="#00C4FF"/>
      <rect x="210" y="15" width="28" height="105" rx="6" fill="#0066FF"/>
      <rect x="270" y="0" width="28" height="120" rx="6" fill="url(#bg4)"/>

      <!-- Sparkle on peak -->
      <circle cx="284" cy="0" r="6" fill="#00D9C0"/>
      <circle cx="284" cy="0" r="14" fill="#00D9C0" opacity="0.3"/>
    </g>

    <!-- Metrics at bottom -->
    <rect x="120" y="290" width="110" height="24" rx="6" fill="#F0F4FF"/>
    <text x="175" y="306" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0066FF" text-anchor="middle">🚀 12K Acessos</text>

    <rect x="245" y="290" width="110" height="24" rx="6" fill="#F0F4FF"/>
    <text x="300" y="306" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0D1B3E" text-anchor="middle">⭐ 4.9 Avaliação</text>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(430, 45)" filter="url(#shadow4)">
    <rect width="120" height="34" rx="17" fill="#0057E0"/>
    <text x="60" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">INOVAÇÃO</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0050D4"/>
      <stop offset="45%" stop-color="#0066FF"/>
      <stop offset="80%" stop-color="#00A2FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="glowCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Base gradient -->
  <rect width="1200" height="320" fill="url(#bannerGradient)"/>

  <!-- Geometric spheres & waves (Webnode identity) -->
  <circle cx="1080" cy="40" r="220" fill="url(#glowCircle)"/>
  <circle cx="980" cy="220" r="140" fill="#00C4FF" opacity="0.12"/>
  <circle cx="120" cy="280" r="160" fill="url(#glowCircle)"/>
  <circle cx="340" cy="50" r="80" fill="#FFFFFF" opacity="0.06"/>

  <!-- Matrix Dots Grid -->
  <g opacity="0.2" fill="#FFFFFF">
    <circle cx="480" cy="80" r="2"/><circle cx="520" cy="80" r="2"/><circle cx="560" cy="80" r="2"/><circle cx="600" cy="80" r="2"/><circle cx="640" cy="80" r="2"/>
    <circle cx="480" cy="120" r="2"/><circle cx="520" cy="120" r="2"/><circle cx="560" cy="120" r="2"/><circle cx="600" cy="120" r="2"/><circle cx="640" cy="120" r="2"/>
    <circle cx="480" cy="160" r="2"/><circle cx="520" cy="160" r="2"/><circle cx="560" cy="160" r="2"/><circle cx="600" cy="160" r="2"/><circle cx="640" cy="160" r="2"/>
    <circle cx="480" cy="200" r="2"/><circle cx="520" cy="200" r="2"/><circle cx="560" cy="200" r="2"/><circle cx="600" cy="200" r="2"/><circle cx="640" cy="200" r="2"/>
  </g>

  <!-- Floating Digital Portfolio Cards Mockup on Right -->
  <g transform="translate(820, 60)" opacity="0.95">
    <!-- Card 1 -->
    <rect x="0" y="20" width="160" height="110" rx="14" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <rect x="16" y="36" width="70" height="8" rx="4" fill="#FFFFFF"/>
    <rect x="16" y="52" width="110" height="5" rx="2.5" fill="rgba(255,255,255,0.6)"/>
    <rect x="16" y="62" width="90" height="5" rx="2.5" fill="rgba(255,255,255,0.6)"/>
    <rect x="16" y="86" width="45" height="18" rx="9" fill="#00C4FF"/>
    <text x="38" y="99" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#0A1628" text-anchor="middle">ONLINE</text>

    <!-- Card 2 -->
    <rect x="140" y="70" width="170" height="120" rx="14" fill="#0A1628" stroke="rgba(0, 196, 255, 0.4)" stroke-width="1.5"/>
    <rect x="156" y="88" width="80" height="8" rx="4" fill="#00C4FF"/>
    <rect x="156" y="104" width="120" height="5" rx="2.5" fill="#8BA3C7"/>
    <rect x="156" y="122" width="138" height="35" rx="8" fill="rgba(255,255,255,0.06)"/>
    <rect x="156" y="165" width="60" height="14" rx="7" fill="#00D9C0"/>
    <text x="186" y="175" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#0A1628" text-anchor="middle">✓ VERIFICADO</text>
  </g>

  <!-- Left Accent Tech Lines -->
  <path d="M0 260 Q 300 240, 600 280 T 1200 250" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <path d="M0 280 Q 400 260, 800 300 T 1200 270" fill="none" stroke="rgba(0,196,255,0.2)" stroke-width="2"/>
</svg>
